<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unterrichts-Artefakte</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#ffffff; --line:#e4e4de; --accent:#2f6fdf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --card:#1f1f1d; --line:#33332f; --accent:#7aa7ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.8rem; margin:0 0 .25rem; }
  p.lead { color:var(--muted); margin:0 0 2rem; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  li a { display:block; padding:16px 18px; background:var(--card); border:1px solid var(--line);
         border-radius:10px; color:inherit; text-decoration:none; }
  li a:hover { border-color:var(--accent); }
  .t { font-weight:600; color:var(--accent); }
  .d { color:var(--muted); font-size:.92rem; }
  .empty { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>Unterrichts-Artefakte</h1>
  <p class="lead">Interaktive Materialien für den Informatik-Unterricht an der Berufsschule.</p>
  <ul id="liste">
    <!-- ARTEFAKTE: neue Einträge hier einfügen, neueste oben -->
    <li><a href="ipv4-fehlersuche/"><span class="t">Fehlersuche im IPv4-Netz</span><br><span class="d">IT-Systeme · Netzwerke · Drucker-Störung mit Wireshark analysieren</span></a></li>
    <li><a href="hex-im-einsatz/"><span class="t">Hex im Einsatz</span><br><span class="d">IT 10 · Zahlensysteme · Hexadezimal in echten Service-Tickets</span></a></li>
  </ul>
</main>
</body>
</html>
